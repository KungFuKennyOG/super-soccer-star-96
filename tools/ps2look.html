<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SSS96 PS2 look test</title>
<!-- Dev page: the PS2-look test scene (game/ps2). npm run serve, then /tools/ps2look.html?shot=duel
     shots: duel | lineup | wide | vr | face | face2 | kit | side | back | clip (number keys switch). &t=1.2 freezes a moment.
     tools/ps2shots.mjs renders them all to files. -->
<style>html,body{margin:0;background:#101830;overflow:hidden}canvas{display:block}#i{position:fixed;left:8px;top:8px;font:12px monospace;color:#fff;text-shadow:0 0 3px #000}
.bar{position:fixed;bottom:6%;width:27%;display:none;font:600 2.3vw 'Trebuchet MS',Arial,sans-serif;color:#fff}.bar b{display:block;padding:.25em .9em;border-radius:.6em;background:linear-gradient(#3a4250e6,#151a22e6);box-shadow:0 0 0 2px #0006}.bar i{display:block;height:.5vw;margin:.5vw .4em 0;background:repeating-linear-gradient(90deg,#f2f2f2 0 1.5vw,#0000 1.5vw 1.9vw)}</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="i"></div>
<!-- the optional 2004-style HUD: dark rounded name bars with a dashed stamina line (invented names) -->
<div class="bar" style="left:7%"><b>Russo</b><i></i></div><div class="bar" style="right:7%;text-align:right"><b>Vega</b><i style="width:80%;margin-left:auto"></i></div>
<script type="module">
import * as THREE from 'three';
import { animate, placeModel } from '../game/actors.js';
import { byId } from '../rules/teams.js';
import { strideRate } from '../rules/dribble.js';
import { buildPlayer2, LIGHT_DIR } from '../game/ps2/player.js';
import { buildPitch, buildLines, buildBall2 } from '../game/ps2/pitch.js';
import { buildStand, buildSky } from '../game/ps2/stand.js';
import { CLIPS, sampleStride, applyPose, newPose } from '../game/mocap.js';

const q = new URLSearchParams(location.search);
let shot = q.get('shot') || 'duel';
const W = +(q.get('w') || innerWidth), H = +(q.get('h') || innerHeight);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#b9c8d4'); scene.fog = new THREE.Fog('#b9c8d4', 70, 320);
// soft, slightly warm daylight: most of it from the sky, a gentle sun, nothing black
scene.add(new THREE.HemisphereLight('#dfe6f0', '#38372c', 0.62));
const sun = new THREE.DirectionalLight('#fff0d6', 0.68); sun.position.copy(LIGHT_DIR).multiplyScalar(50); scene.add(sun);
const camera = new THREE.PerspectiveCamera(40, W / H, 0.05, 400);

scene.add(buildSky(), buildPitch());
scene.add(buildLines([[-60, -34, 40, -34], [34, -34, 34, 30], [34, -14, 17.5, -14], [17.5, -14, 17.5, 28], [-18, -34, -18, 30]]));
const home = '#c4122c';
const side = buildStand({ len: 110, home }); side.position.set(-12, 0, -39.5); scene.add(side);
const end = buildStand({ len: 82, home }); end.position.set(40, 0, 0); end.rotation.y = -Math.PI / 2; scene.add(end);
const corner = buildStand({ len: 26, home }); corner.position.set(44, 0, -43); corner.rotation.y = -Math.PI / 4; scene.add(corner);

const MAD = byId('MAD').kit, TUR = byId('TUR').kit;
const cast = [
  { kit: TUR, num: 10, look: 0, o: { style: 0, skinI: 0, hairI: 1 } },      // short dark crop
  { kit: MAD, num: 5, look: 1, o: { style: 2, skinI: 1, hairI: 0 } },       // slicked back
  { kit: MAD, num: 3, look: 3, o: { style: 1, skinI: 3, hairI: 3 } },       // shaved
  { kit: MAD, num: 23, look: 2, o: { style: 3, skinI: 0, hairI: 2 } },      // ponytail
  { kit: TUR, num: 8, look: 4, o: { style: 4, skinI: 2, hairI: 3 } },       // curls
  { kit: TUR, num: 4, look: 5, o: { style: 0, skinI: 4, hairI: 3 } },
];
const t0 = performance.now();
const players = cast.map(c => {
  const m = buildPlayer2(c.kit, c.num, c.look, c.o);
  scene.add(m.root, m.shadow);
  return { m, p: { x: 0, z: 0, fx: 0, fz: 1, vx: 0, vz: 0, role: 'mate', stride: 0 } };
});
const buildMs = Math.round(performance.now() - t0);            // painting six players' sheets and building their meshes
const ball = buildBall2(); scene.add(ball);
const bp = { x: 0, y: 0.11, z: 0 };

// A shot: where each player is at time t ([x, z, heading, speed, stride offset] or null = off stage),
// the ball, the camera. Headings: 0 = toward +z (away from the main stand).
const off = null;
const SHOTS = {
  duel: { fov: 26, cam: [-0.9, 0.7, 4.6], at: [0.15, 1.02, 0], ball: [0.2, 1.3], set: t => [[-0.28, 0, 0.12, 6.4, 1.9], [0.5, -0.3, 0.02, 6.2, 5.0], off, off, [-9, -10, 1.2, 2, 0], [9, -8, -1.2, 3, 2]] },
  lineup: { fov: 30, cam: [0.4, 2.5, 2.7], at: [0, 1.3, 0], ball: [3, 3], set: t => [off, off, [-0.5, 0, 0.25, 1.5, 0.6], [0.55, 0.15, 0.2, 1.5, 3.9], off, off] },
  wide: { fov: 30, cam: [2, 8.5, 17], at: [0, 1.2, -6], ball: [0.5, 0.2], set: t => [[-0.5, 0, 1.2, 0, 0], [0.6, -0.5, -1.4, 0, 0], [3.5, -5, -0.6, 0, 1], [-4, -6, 0.6, 2, 2], [-6.5, -2, 1.5, 0, 0], [5, 2.5, -2.2, 3, 4]] },
  vr: { fov: 92, cam: [0.1, 1.66, 2.3], at: [0.1, 1.5, 0], ball: [0.35, 1.2], set: t => [[-0.6, 0, 0.15, 0, 0], [0.75, -0.2, -0.2, 0, 0], off, off, [-5, -9, 1, 3, 1], [6, -12, -1, 3, 2]] },
  face: { fov: 22, cam: [0, 1.74, 1.25], at: [0, 1.7, 0], ball: [3, 3], set: t => [[-0.2, 0, 0.3, 0, 0], [0.2, 0, -0.3, 0, 0], off, off, off, off] },
  face2: { fov: 22, cam: [0, 1.74, 1.25], at: [0, 1.7, 0], ball: [3, 3], set: t => [off, off, [-0.2, 0, 0.5, 0, 0], [0.2, 0, -0.5, 0, 0], off, off] },
  kit: { fov: 28, cam: [0, 1.15, 3.6], at: [0, 1.0, 0], ball: [0, 0.6], set: t => [[-0.5, 0, 0.1, 0, 0], [0.5, 0, -0.1, 0, 0], off, off, off, off] },
  side: { fov: 28, cam: [3.7, 1.15, 0.3], at: [0, 1.0, 0], ball: [3, 3], set: t => [[0, -0.55, 0, 0, 0], [0, 0.55, 0, 0, 0], off, off, off, off] },
  // one player from the side, the camera going with him: [speed, which way he travels off his facing]
  ...Object.fromEntries(Object.entries({ walk: [1.5, 0], jog: [3.6, 0], sprint: [7.4, 0], strafe: [3, Math.PI / 2], backpedal: [2.6, Math.PI] }).map(([k, [v, off]]) => [k, { fov: 24, cam: t => [Math.sin(off) * v * t + 4.6 * Math.cos(off) * 1 + 0, 1.0, Math.cos(off) * v * t + (off ? 5 : 0.4)], at: t => [Math.sin(off) * v * t, 0.95, Math.cos(off) * v * t], ball: [30, 30],
    set: t => [[Math.sin(off) * v * t, Math.cos(off) * v * t, 0, v, 0, off], null, null, null, null, null] }])),
  // one player through the gears: stands, walks, jogs, sprints, pulls up, stands (the camera goes with him)
  cuts: { fov: 30, cam: t => [cutsAt(t)[0] * 0.75 - 1, 1.4, cutsAt(t)[1] * 0.4 + 8.5], at: t => [cutsAt(t)[0], 0.95, cutsAt(t)[1]], ball: t => [cutsAt(t)[0] + 9, -3], set: t => [cutsAt(t), null, null, null, null, null] },
  burst: { fov: 30, cam: t => [bX(t) + 1.6, 1.0, 5.6], at: t => [bX(t) + 0.3, 0.92, 0], ball: t => [bX(t) + 7, 2], set: t => [[bX(t), 0, Math.PI / 2, reelV(t, BURST), 0], null, null, null, null, null] },
  reel: { fov: 30, cam: t => [reelX(t) + 1.2, 1.05, 5.4], at: t => [reelX(t) + 0.2, 0.95, 0], ball: t => [reelX(t) + 6, 2], set: t => [[reelX(t), 0, Math.PI / 2, reelV(t), 0], null, null, null, null, null] },
  idle: { fov: 26, cam: [0.6, 1.25, 5.2], at: [0, 0.95, 0], ball: [2.5, 3.5], set: t => [[-1.5, 0, 0.2, 0, 0], [-0.5, 0.2, -0.1, 0, 0], [0.5, 0, 0.3, 0, 0], [1.5, 0.3, -0.3, 0, 0], null, null] },
  back: { fov: 28, cam: [0, 1.25, 3.6], at: [0, 1.0, 0], ball: [3, 3], set: t => [[-0.5, 0, Math.PI - 0.15, 0, 0], [0.5, 0, Math.PI + 0.15, 0, 0], off, off, off, off] },
  clip: { fov: 36, cam: t => [-13 + t * 6.3 + 3.2, 0.8 + 0.15 * t, 4.6 - 0.25 * t], at: t => [-13 + t * 6.3 + 0.4, 1.02, 0], ball: t => [-13 + t * 6.3 + 0.75 + 0.15 * Math.sin(t * 7), 0.1],
    set: t => [[-13 + t * 6.3, 0, Math.PI / 2, 6.3, 0], [-13 + t * 6.3 - 0.45, -0.75 + 0.1 * Math.sin(t * 2), Math.PI / 2 + 0.1, 6.3, 3.3], off, off, [8 - t, -9, -1.5, 3, 1], [-2, -14, 1.3, 2, 2]] },
};
const val = (v, t) => (typeof v === 'function' ? v(t) : v);
// a man put through it: sprint, dead stop, off to the side, cut back, sprint, stop ([time, speed, heading in degrees])
const CUTS = [[0, 0, 90], [0.8, 7.4, 90], [2.5, 0, 90], [3.3, 5.2, 0], [4.5, 5.2, 180], [5.7, 7.4, 90], [7.3, 0, 90]], cutLog = [];
function cutsAt(t) {
  if (!cutLog.length) {
    let x = -9, z = 0, vx = 0, vz = 0, f = Math.PI / 2;
    for (let i = 0, h = 1 / 120; i < 120 * 12; i++) {
      let c = CUTS[0]; for (const k of CUTS) if (i * h >= k[0]) c = k;
      const a = c[2] * Math.PI / 180, tx = Math.sin(a) * c[1], tz = Math.cos(a) * c[1], dx = tx - vx, dz = tz - vz, d = Math.hypot(dx, dz), st = Math.min(d, 16 * h);
      if (d > 0) { vx += dx / d * st; vz += dz / d * st; }
      const sp = Math.hypot(vx, vz);
      if (sp > 0.6) { let e = Math.atan2(vx, vz) - f; e -= Math.round(e / (Math.PI * 2)) * Math.PI * 2; f += Math.max(-10 * h, Math.min(10 * h, e)); }
      x += vx * h; z += vz * h; cutLog.push([x, z, f, sp, 0, sp > 0.05 ? Math.atan2(vx, vz) - f : 0]);
    }
  }
  return cutLog[Math.max(0, Math.min(cutLog.length - 1, Math.round(t * 120)))];
}
const BURST = [[0, 0], [0.7, 0], [1.02, 7.6], [3.2, 7.6], [3.55, 0], [5, 0]];      // standing, flat out in a third of a second (the sim's 24 m/s2), stop
const REEL0 = [[0, 0], [1.5, 0], [2, 1.5], [4, 1.5], [4.6, 3.6], [6.6, 3.6], [7.4, 7.4], [9.4, 7.4], [10.3, 0], [13, 0]];   // [time, speed]
function reelV(t, REEL = REEL0) { for (let i = 1; i < REEL.length; i++) if (t <= REEL[i][0]) { const [a, va] = REEL[i - 1], [b, vb] = REEL[i]; return va + (vb - va) * Math.max(0, (t - a) / (b - a)); } return 0; }
function reelX(t, T = REEL0, x = -20) { for (let u = 0; u < t; u += 1 / 120) x += reelV(u, T) / 120; return x; }
const bX = t => reelX(t, BURST, -9);
let time = +(q.get('t') || 0);
const RAW = CLIPS[q.get('raw')], rawPose = newPose();
function pose(t, dt) {
  const s = SHOTS[shot], set = s.set(t), b = val(s.ball, t);
  bp.x = b[0]; bp.z = b[1]; ball.position.set(bp.x, 0.11, bp.z); ball.rotation.set(t * 9, 0.4, t * 3);
  players.forEach(({ m, p }, i) => {
    const d = set[i]; m.root.visible = m.shadow.visible = !!d;
    if (!d) return;
    const go = d[2] + (d[5] || 0);                           // d[5]: which way he travels, off the way he faces
    p.x = d[0]; p.z = d[1]; p.fx = Math.sin(d[2]); p.fz = Math.cos(d[2]); p.vx = Math.sin(go) * d[3]; p.vz = Math.cos(go) * d[3];
    if (p.stride === null) p.stride = d[4] + t * strideRate(d[3]); else p.stride += dt * strideRate(d[3]);   // his stride turns over with his speed
    placeModel(m, p);
    animate(m, p, dt, t + i, false, null, bp, false);
    if (RAW) applyPose(m.bone, sampleStride(RAW, RAW.kind === 'loop' ? (t + i * 1.7) / RAW.period * Math.PI * 2 : p.stride, rawPose));        // ?raw=clip: the captured stride alone, nothing over it
    m.shadow.position.set(p.x - LIGHT_DIR.x * 0.12, 0.01, p.z - LIGHT_DIR.z * 0.12);
  });
  for (const el of document.querySelectorAll('.bar')) el.style.display = shot === 'wide' ? 'block' : 'none';
  camera.fov = s.fov; camera.aspect = W / H; camera.updateProjectionMatrix();
  camera.position.set(...val(s.cam, t)); camera.lookAt(...val(s.at, t));
}
// poses ease in over time (speed, lean, the head's turn), so a still is run up to, not jumped to
function warm() { for (const pl of players) { pl.p.stride = null; pl.m.gait = null; } for (let k = 90; k > 0; k--) pose(time - k / 60, 1 / 60); }
function frame(dt) {
  time += dt; pose(time, dt); renderer.render(scene, camera);
  document.getElementById('i').textContent = q.get('info') ? `${shot}  calls ${renderer.info.render.calls}  tris ${renderer.info.render.triangles}` : '';
}
window.__look = {
  ready: false, step: frame,
  shot(name, t = 0) { shot = name; time = t; warm(); frame(0); },
  info: () => ({ calls: renderer.info.render.calls, triangles: renderer.info.render.triangles, textures: renderer.info.memory.textures, buildMs, playerTris: players[0].m.mesh.geometry.index.count / 3 }),
  sheet: (i, k = 0) => players[i].m.mesh.material[k].map.image.toDataURL('image/png'),
};
addEventListener('keydown', e => { const n = Object.keys(SHOTS)[+e.key - 1]; if (n) { shot = n; time = 0; } });
warm(); frame(0);
window.__look.ready = true;
if (!q.get('still')) { let last = performance.now(); const loop = now => { frame(Math.min(0.05, (now - last) / 1000) * (q.get('t') ? 0 : 1)); last = now; requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
</script>
</body>
</html>
